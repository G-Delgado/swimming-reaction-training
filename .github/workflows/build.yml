name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    # Back on 22.04: it's the platform buildozer is actually tested against
    # upstream. (Reverting the ubuntu-latest change, which was made while
    # chasing what turned out to be a GitHub Actions outage, not a real
    # incompatibility.)
    #
    # Heads-up: 22.04 begins deprecation on 2026-09-17. The build is not
    # 24.04-blocked — the libffi failure was a missing libltdl-dev, fixed
    # below — so moving to 24.04 later should just work.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # python-for-android internally spawns "python -m venv" while
      # installing pure-Python pip dependencies. If a bare "python" on PATH
      # resolves to a different interpreter than the one above, the venv's
      # bundled pip can end up mismatched with itself and crash on import.
      # Pin "python"/"python3" system-wide to the pinned 3.11 interpreter so
      # every nested subprocess gets the same, known-good version.
      - name: Pin python to 3.11 system-wide
        run: |
          PYBIN="$(command -v python3.11)"
          sudo ln -sf "$PYBIN" /usr/local/bin/python
          sudo ln -sf "$PYBIN" /usr/local/bin/python3
          python --version

      # p4a's libffi recipe runs autogen.sh, and its own docstring spells out
      # what that needs:
      #   automake     -> aclocal
      #   autoconf     -> autoreconf
      #   libltdl-dev  -> defines the LT_SYS_SYMBOL_USCORE macro
      # Missing libltdl-dev is what produced
      #   "configure.ac:215: error: possibly undefined macro: LT_SYS_SYMBOL_USCORE"
      # thousands of lines deep in the build.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip patch pkg-config cmake \
            autoconf automake libtool libtool-bin libltdl-dev gettext m4 \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev build-essential ccache
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6 || true

      # Fail fast and loudly if the macro still isn't reachable, rather than
      # discovering it 20 minutes into a build.
      - name: Verify libffi's autotools macro is available
        run: |
          if grep -rqs "AC_DEFUN(\[LT_SYS_SYMBOL_USCORE\]" /usr/share/aclocal/; then
            echo "OK: LT_SYS_SYMBOL_USCORE found in $(grep -rls 'AC_DEFUN(\[LT_SYS_SYMBOL_USCORE\]' /usr/share/aclocal/)"
          else
            echo "MISSING: LT_SYS_SYMBOL_USCORE not in /usr/share/aclocal — libffi will fail"
            exit 1
          fi

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # NOTE: no `set -o pipefail` here. `yes` is killed by SIGPIPE the moment
      # buildozer stops reading stdin, which is normal and harmless, but with
      # pipefail it marks the whole pipeline — and therefore a perfectly good
      # build — as failed. Take buildozer's own exit status instead.
      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug 2>&1 | tee /tmp/buildozer.log
          exit "${PIPESTATUS[1]}"

      # Buildozer buries the real failure thousands of lines above its own
      # "Command failed" banner, so pull it out automatically instead of
      # making a human scroll the raw log.
      - name: Show the real error
        if: failure()
        run: |
          echo "=================== p4a version actually used ==================="
          P4A=.buildozer/android/platform/python-for-android
          if [ -d "$P4A" ]; then
            git -C "$P4A" describe --tags --always 2>/dev/null || true
            git -C "$P4A" log -1 --format='%H %ci %s' 2>/dev/null || true
          else
            echo "(p4a not cloned)"
          fi

          echo ""
          echo "=================== first real errors ==================="
          grep -nEi "error:|ImportError|ModuleNotFoundError|SyntaxError|Traceback|No such file|not found|failed with exit|fatal error" \
            /tmp/buildozer.log | grep -viE "warn|deprecat|-Werror|error_|stderr" | head -40 || true

          echo ""
          echo "=================== 120 lines before the failure ==================="
          LINE=$(grep -n "Command failed" /tmp/buildozer.log | head -1 | cut -d: -f1)
          if [ -n "$LINE" ]; then
            START=$(( LINE > 120 ? LINE - 120 : 1 ))
            sed -n "${START},${LINE}p" /tmp/buildozer.log
          else
            tail -120 /tmp/buildozer.log
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: /tmp/buildozer.log
          if-no-files-found: ignore

      # always(): if an APK exists, hand it over even when a later step trips.
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swim-start-trainer-apk
          path: bin/*.apk
          if-no-files-found: warn
