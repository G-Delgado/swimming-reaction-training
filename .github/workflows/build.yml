name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds inside Kivy's official, version-pinned Buildozer Docker image
      # instead of raw apt/pip on the runner. This avoids Python/pip/NDK
      # version drift on the bare runner image, which is what broke the
      # previous approach (venv created with a Python version whose bundled
      # pip didn't match what python-for-android expected).
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swim-start-trainer-apk
          path: ${{ steps.buildozer.outputs.filename }}
