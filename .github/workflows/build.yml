name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    # ubuntu-22.04 begins deprecation on 2026-09-17 and GitHub runs brownouts
    # ahead of that, during which jobs on that label fail to get a runner
    # ("not acquired by Runner of type hosted"). ubuntu-latest has the largest
    # pool and is where this needs to end up anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # python-for-android internally spawns "python -m venv" while
      # installing pure-Python pip dependencies. If a bare "python" on PATH
      # resolves to a different interpreter than the one above, the venv's
      # bundled pip can end up mismatched with itself and crash on import.
      # Pin "python"/"python3" system-wide to the pinned 3.11 interpreter so
      # every nested subprocess gets the same, known-good version.
      - name: Pin python to 3.11 system-wide
        run: |
          PYBIN="$(command -v python3.11)"
          sudo ln -sf "$PYBIN" /usr/local/bin/python
          sudo ln -sf "$PYBIN" /usr/local/bin/python3
          python --version

      # Package names differ slightly across 22.04/24.04/26.04, so install the
      # portable set first and treat the version-specific ones as optional.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential
          sudo apt-get install -y libtinfo6 || true

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swim-start-trainer-apk
          path: bin/*.apk
